<svg xmlns="http://www.w3.org/2000/svg" width="160" height="54" viewBox="0 0 160 54" role="img"><title>Projects — Anyi</title><metadata>Original action graphic for the GitHub profile; self-contained vector icon and subtle moving edge.</metadata><style>.surface{fill:#f6faf8;stroke:#c5dacf}.symbol{stroke:#245c45}.text-dark{display:none}.accent{stroke:#54a381}@media(prefers-color-scheme:dark){.surface{fill:#17271f;stroke:#385644}.text-light{display:none}.text-dark{display:inline}.symbol{stroke:#b8e5cc}}.accent{animation:edge 6s linear infinite}@keyframes edge{to{stroke-dashoffset:-240}}@media(prefers-reduced-motion:reduce){.accent{animation:none}}</style><rect class="surface" x=".75" y=".75" width="158.5" height="51" rx="12" stroke-width="1.5"/><g class="symbol" transform="translate(20 15)" fill="none" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-14-2 16"/></g><image class="text-light" width="160" height="54" href="data:image/png;base64,"/><image class="text-dark" width="160" height="54" href="data:image/png;base64,"/><path class="accent" d="M20 51H140" fill="none" stroke-width="1.8" stroke-dasharray="20 100"/></svg>
